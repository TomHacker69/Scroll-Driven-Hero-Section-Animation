<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Car Animation — ITZFIZZ</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <link rel="stylesheet" href="style.css?v=1.8" />
</head>
<body>

  <!-- Hero Track Section -->
  <div class="section" id="hero-section">
    <div class="track" id="track">
      
      <div class="road" id="road">
        <img
          src="car.png"
          alt="McLaren Supercar"
          class="car"
          id="car"
        />
        <div class="trail" id="trail"></div>

        <div class="value-add" id="valueText">
          <span class="value-letter">W</span>
          <span class="value-letter">E</span>
          <span class="value-letter">L</span>
          <span class="value-letter">C</span>
          <span class="value-letter">O</span>
          <span class="value-letter">M</span>
          <span class="value-letter">E</span>
          <span class="value-letter space">&nbsp;</span>
          <span class="value-letter">I</span>
          <span class="value-letter">T</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">F</span>
          <span class="value-letter">I</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">Z</span>
        </div>
      </div>

      <div class="text-box" id="box1">
        <span class="num-box" data-target="58">0%</span>
        <span>Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box2">
        <span class="num-box" data-target="23">0%</span>
        <span>Decreased in customer phone calls</span>
      </div>

      <div class="text-box" id="box3">
        <span class="num-box" data-target="27">0%</span>
        <span>Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box4">
        <span class="num-box" data-target="40">0%</span>
        <span>Decreased in customer phone calls</span>
      </div>

      <div class="scroll-hint" id="scrollHint">
        <span>Scroll to Explore</span>
        <div class="scroll-arrow"></div>
      </div>

    </div>
  </div>

  <script src="app.js?v=1.4"></script>
</body>
</html>
