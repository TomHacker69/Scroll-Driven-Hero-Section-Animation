<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Car Animation — ITZFIZZ</title>

  <!-- Google Fonts: Syne & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- GSAP & ScrollTrigger via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Scroll Section (Scroll-Driven Track) -->
  <div class="section" id="hero-section">
    <div class="track" id="track">
      
      <!-- Highway Track -->
      <div class="road" id="road">
        <img
          src="car.png"
          alt="McLaren Supercar"
          class="car"
          id="car"
        />
        <div class="trail" id="trail"></div>

        <!-- Headline Typography (Illuminated by Car) -->
        <div class="value-add" id="valueText">
          <span class="value-letter">W</span>
          <span class="value-letter">E</span>
          <span class="value-letter">L</span>
          <span class="value-letter">C</span>
          <span class="value-letter">O</span>
          <span class="value-letter">M</span>
          <span class="value-letter">E</span>
          <span class="value-letter space">&nbsp;</span>
          <span class="value-letter">I</span>
          <span class="value-letter">T</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">F</span>
          <span class="value-letter">I</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">Z</span>
        </div>
      </div>

      <!-- Floating Impact Metric Cards -->
      <div class="text-box" id="box1" style="top: 8%; right: 32%;">
        <span class="num-box">58%</span>
        <span>Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box2" style="bottom: 8%; right: 35%;">
        <span class="num-box">23%</span>
        <span>Decreased in customer phone calls</span>
      </div>

      <div class="text-box" id="box3" style="top: 8%; right: 10%;">
        <span class="num-box">27%</span>
        <span>Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box4" style="bottom: 8%; right: 12%;">
        <span class="num-box">40%</span>
        <span>Decreased in customer phone calls</span>
      </div>

    </div>
  </div>

  <!-- Animation Logic -->
  <script src="app.js"></script>
</body>
</html>
